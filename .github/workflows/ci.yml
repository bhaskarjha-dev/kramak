name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Spec, Schemas & Tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Tooling Deprecation Notices
        run: |
          node scripts/validate.js

      - name: Validate Kramak JSON Schemas & Templates
        run: |
          node -e "
            const fs = require('fs');
            const stateSchema = JSON.parse(fs.readFileSync('.kramak/schemas/state.schema.json', 'utf8'));
            const wiSchema = JSON.parse(fs.readFileSync('.kramak/schemas/work-item.schema.json', 'utf8'));
            const wiStateSchema = JSON.parse(fs.readFileSync('.kramak/schemas/work-item-state.schema.json', 'utf8'));
            const stateShim = JSON.parse(fs.readFileSync('spec/state.schema.json', 'utf8'));
            const state = JSON.parse(fs.readFileSync('templates/state.json', 'utf8'));

            const allowed = Object.keys(stateSchema.properties || {});
            for (const k of Object.keys(state)) {
              if (stateSchema.additionalProperties === false && !allowed.includes(k)) {
                console.error('❌ Property not allowed in schema:', k);
                process.exit(1);
              }
            }
            if (!stateSchema.properties.phase.enum.includes(state.phase)) {
              console.error('❌ Invalid phase in state.json:', state.phase);
              process.exit(1);
            }
            console.log('✅ .kramak/schemas/ and templates/state.json fully validated');
          "

      - name: Verify Shell Scripts & Hook Syntax
        run: |
          sh -n hooks/pre-commit
          sh -n init.sh
          echo "✅ Shell script syntax valid"
