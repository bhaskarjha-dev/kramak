name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Spec, Schemas & Tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Kramak Pipeline Validator on Templates
        run: |
          node scripts/validate.js --template

      - name: Validate JSON Schema & Templates
        run: |
          node -e "
            const fs = require('fs');
            const schema = JSON.parse(fs.readFileSync('spec/state.schema.json', 'utf8'));
            const state = JSON.parse(fs.readFileSync('templates/state.json', 'utf8'));
            const allowed = Object.keys(schema.properties || {});
            for (const k of Object.keys(state)) {
              if (schema.additionalProperties === false && !allowed.includes(k)) {
                console.error('❌ Property not allowed in schema:', k);
                process.exit(1);
              }
            }
            if (!schema.properties.phase.enum.includes(state.phase)) {
              console.error('❌ Invalid phase in state.json:', state.phase);
              process.exit(1);
            }
            console.log('✅ spec/state.schema.json and templates/state.json fully validated');
          "

      - name: Verify Pre-commit Hook Syntax
        run: |
          sh -n hooks/pre-commit
          sh -n init.sh
          echo "✅ Shell script syntax valid"
