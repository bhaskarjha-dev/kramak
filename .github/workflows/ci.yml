name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Kramak Specifications & Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Schema Validation Tools
        run: npm install -g ajv-cli ajv-formats

      - name: Validate JSON Schemas against Draft 2020-12 Meta-Schema
        run: |
          npx ajv compile -s .kramak/schemas/state.schema.json --spec=draft2020 --strict=false
          npx ajv compile -s .kramak/schemas/work-item.schema.json --spec=draft2020 --strict=false
          npx ajv compile -s .kramak/schemas/work-item-state.schema.json --spec=draft2020 --strict=false

      - name: Validate JSON Schema Syntax & Completeness
        run: |
          node -e "
            const fs = require('fs');
            const schemas = [
              '.kramak/schemas/state.schema.json',
              '.kramak/schemas/work-item.schema.json',
              '.kramak/schemas/work-item-state.schema.json'
            ];
            for (const p of schemas) {
              const s = JSON.parse(fs.readFileSync(p, 'utf8'));
              console.log('Valid JSON:', p);
            }
            const state = JSON.parse(fs.readFileSync('.kramak/schemas/state.schema.json', 'utf8'));
            const requiredPhases = ['bootstrap','planning','dispatch','executing','auditing','merge_queue','waiting','escalated','complete'];
            for (const ph of requiredPhases) {
              if (!state.properties.phase.enum.includes(ph)) throw new Error('Missing phase: ' + ph);
            }
            console.log('All 9 FSM phases verified.');
          "

      - name: Audit Encoding & Control Characters (Zero C1 Codes)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function getFiles(dir, list = []) {
              for (const f of fs.readdirSync(dir)) {
                if (f === '.git' || f === 'node_modules') continue;
                const p = path.join(dir, f);
                if (fs.statSync(p).isDirectory()) getFiles(p, list);
                else if (f.endsWith('.md') || f.endsWith('.json') || f.endsWith('.yml')) list.push(p);
              }
              return list;
            }
            const files = getFiles('.');
            let errors = 0;
            for (const f of files) {
              const buf = fs.readFileSync(f);
              const str = buf.toString('utf8');
              for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i);
                if (code >= 0x80 && code <= 0x9F) {
                  console.error('C1 Control character found in ' + f + ' at char ' + i + ': U+' + code.toString(16));
                  errors++;
                }
              }
            }
            if (errors > 0) process.exit(1);
            console.log('Zero C1 control characters across all workspace files.');
          "

      - name: Validate Markdown Link Graph
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function getMd(dir, list = []) {
              for (const f of fs.readdirSync(dir)) {
                if (f === '.git' || f === 'node_modules') continue;
                const p = path.join(dir, f);
                if (fs.statSync(p).isDirectory()) getMd(p, list);
                else if (f.endsWith('.md')) list.push(p);
              }
              return list;
            }
            const files = getMd('.');
            let broken = 0;
            const regex = /\[([^\]]+)\]\(([^)]+)\)/g;
            for (const f of files) {
              const text = fs.readFileSync(f, 'utf8');
              let m;
              while ((m = regex.exec(text)) !== null) {
                const raw = m[2].trim();
                if (raw.startsWith('#') || raw.startsWith('http://') || raw.startsWith('https://') || raw.startsWith('mailto:')) continue;
                const clean = raw.split('#')[0];
                if (!clean) continue;
                if (clean.includes('state.json') && !clean.includes('state.schema.json')) continue;
                const resolved = path.resolve(path.dirname(f), clean);
                if (!fs.existsSync(resolved)) {
                  console.error('Broken link in ' + f + ': [' + m[1] + '](' + raw + ') -> ' + resolved);
                  broken++;
                }
              }
            }
            if (broken > 0) process.exit(1);
            console.log('100% of internal markdown links resolve cleanly.');
          "

      - name: Validate Core Specification Files Exist
        run: |
          for f in \
            .kramak/ROUTER.md \
            .kramak/AGENTS.md \
            .kramak/SKILL.md \
            .kramak/planner/CORE.md \
            .kramak/planner/capability-gate.md \
            .kramak/planner/output-contract.md \
            .kramak/planner/edge-cases.md \
            .kramak/planner/domain-conventions.md \
            .kramak/executor/CORE.md \
            .kramak/executor/error-recovery.md \
            .kramak/executor/tool-playbooks.md \
            .kramak/ledger/FORMAT.md; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            echo "OK $f"
          done

      - name: Validate Adapter Files
        run: |
          for f in \
            adapters/claude-code/CLAUDE.md \
            adapters/cursor/.cursorrules \
            adapters/antigravity/SKILL.md \
            adapters/devin/AGENTS.md \
            adapters/cline/.clinerules \
            adapters/copilot/copilot-instructions.md \
            adapters/aider/CONVENTIONS.md; do
            test -f "$f" || { echo "Missing adapter: $f"; exit 1; }
            echo "OK $f"
          done
